<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>DoMuS Desktop</title>
    <style>
      body {
        font: 15px system-ui;
        background: #f4f6f3;
        color: #213630;
        padding: 30px;
      }
      h1 {
        color: #244d3c;
      }
      label {
        display: block;
        margin: 18px 0;
      }
      input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        margin-top: 6px;
      }
      button {
        background: #244d3c;
        color: white;
        border: 0;
        border-radius: 5px;
        padding: 12px;
        cursor: pointer;
      }
      #status {
        padding: 12px;
        background: #e4ecd9;
      }
      #share {
        overflow-wrap: anywhere;
      }
    </style>
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <h1>DoMuS Desktop</h1>
    <p>Verbind je dossieromgeving met een lokale SMB-share.</p>
    <button id="choose">Sharemap kiezen</button><span id="share"></span>
    <form id="connect">
      <label
        >Server-URL<input
          name="server"
          type="url"
          required
          placeholder="https://domus.example.nl" /></label
      ><label
        >Eenmalig ticket uit Voorkeuren<input
          name="ticket"
          required
          autocomplete="off" /></label
      ><button>Verbinden</button>
    </form>
    <p id="status" role="status">Nog niet verbonden.</p>
  </body>
</html>
