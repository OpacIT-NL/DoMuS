<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DoMuS · Dossierbeheer</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/workspace.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <aside class="appbar">
      <a class="brand" href="/" aria-label="DoMuS startpagina">D<span>o</span>MuS<span class="dot">.</span></a>
      <nav id="nav" aria-label="Hoofdmenu"></nav>
      <div class="appbar-spacer"></div>
      <span class="app-version">DOSSIERWERKPLEK</span>
    </aside>
    <main>
      <header>
        <span class="breadcrumb">WERKOMGEVING <i>/</i> <b id="crumb">OVERZICHT</b></span>
        <div id="account"></div>
      </header>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="content"></section>
    </main>
    <dialog id="dialog">
      <form id="modal">
        <div class="modal-head">
          <h2 id="modal-title"></h2>
          <button type="button" id="close" aria-label="Sluiten">×</button>
        </div>
        <div id="modal-fields"></div>
        <p id="modal-error" role="alert"></p>
        <button class="primary" type="submit">Opslaan</button>
      </form>
    </dialog>
  </body>
</html>
