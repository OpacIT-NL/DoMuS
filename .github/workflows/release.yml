name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestaande versietag, bijvoorbeeld v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate existing release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {releaseVersion} from './scripts/package-server.js';
          const tag=process.env.RELEASE_TAG;
          if(!tag.startsWith('v'))throw Error('De tag moet beginnen met v.');
          const version=releaseVersion(tag.slice(1));
          const sha=execFileSync('git',['rev-parse','--verify',`refs/tags/${tag}^{commit}`],{encoding:'utf8'}).trim();
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(head!==sha)throw Error('De checkout komt niet overeen met de tag.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${version}\ntag=${tag}\nsha=${sha}\n`);
          JS
      - run: npm run check
      - run: npm test

  server:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build flat server ZIP
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm run package:server -- --version "$RELEASE_VERSION"
      - name: Verify extracted server dependencies and CLI
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          package_dir="$RUNNER_TEMP/domus-server"
          mkdir -p "$package_dir"
          unzip -q "dist/domus-server-$RELEASE_VERSION.zip" -d "$package_dir"
          cd "$package_dir"
          test -f package.json
          test -f server/index.js
          test ! -e config.json
          npm ci --omit=dev
          printf 'enable\nshow version\nshutdown\n' | npm run cli
      - uses: actions/upload-artifact@v4
        with:
          name: release-server
          path: dist/*.zip
          if-no-files-found: error

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils binutils desktop-file-utils zstd
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - run: npm ci
        working-directory: desktop
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:windows -- --x64 --publish never "-c.extraMetadata.version=$env:RELEASE_VERSION"
      - name: Build Linux DEB and Flatpak
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm run build:linux -- --x64 --publish never "-c.extraMetadata.version=$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.deb
            desktop/dist/*.flatpak
          if-no-files-found: error

  publish:
    needs: [prepare, server, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Validate assets and calculate checksums
        working-directory: release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "domus-server-$RELEASE_VERSION.zip"
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.flatpak' | wc -l)" -eq 1
          sha256sum *.zip *.exe *.deb *.flatpak > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Reuse existing releases, including published ones, when retrying a build.
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            echo "Bestaande release $RELEASE_TAG bijwerken."
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "DoMuS $RELEASE_TAG" --generate-notes "${flags[@]}"
            is_draft=true
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
